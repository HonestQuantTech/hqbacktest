name: CI

on:
  push:
    branches: [main, master, dev-*]
  pull_request:

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install hqbacktest (with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: black --check src tests examples

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -q -m "not integration" --maxfail=1 \
            --cov=hqbacktest --cov-report=term-missing --cov-fail-under=80

      - name: Run integration tests (best-effort, may skip)
        run: |
          pytest tests/data/integration -q --maxfail=1 || \
            echo "::warning::integration tests failed or skipped (no real CSV data)"

      - name: Run end-to-end examples
        run: |
          python examples/buy_and_hold.py
          python examples/moving_average.py

      - name: Run CLI smoke
        run: |
          # Hermetic CSV snapshot so the CLI run needs no ~/.hqdata.
          mkdir -p /tmp/ci-data/tushare/stock_daily
          printf 'date,is_open\n20240102,Y\n20240103,Y\n20240104,Y\n' \
            > /tmp/ci-data/tushare/calendar.csv
          for d in 20240102 20240103 20240104; do
            printf 'symbol,date,open,high,low,close,volume\n600000.SH,%s,10.00,15.00,9.00,10.00,1000\n' "$d" \
              > "/tmp/ci-data/tushare/stock_daily/$d.csv"
          done
          cat > /tmp/ci-config.toml <<'EOF'
          [start]
          start_date = "20240102"
          end_date = "20240104"
          [capital]
          initial_cash = "100000"
          [data]
          source = "tushare"
          data_root = "/tmp/ci-data"
          [strategy]
          module = "examples.buy_and_hold"
          [output]
          directory = "/tmp/hqbacktest-ci-out"
          EOF
          python -m hqbacktest run --config /tmp/ci-config.toml --output /tmp/hqbacktest-ci-out
          test -f /tmp/hqbacktest-ci-out/summary.json

      - name: Build sdist + wheel
        run: python -m pip install build && python -m build
